
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python To-Do List</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="container">

        <h1>My To-Do List Application</h1>
        <p class="subtitle">Organize your daily tasks</p>

        <!-- Form to add a new task -->
        <form action="{{ url_for('add_task') }}"
              method="POST"
              class="add-form">

            <input
                type="text"
                name="title"
                placeholder="Enter a new task..."
                maxlength="200"
                required
            >

            <button type="submit">Add Task</button>
        </form>

        <h2>Your Tasks</h2>

        <!-- Display tasks if available -->
        {% if tasks %}

            <ul class="task-list">

                {% for task in tasks %}
                    <li class="task-item">

                        <span class="{% if task['completed'] %}completed{% endif %}">
                            {{ task['title'] }}
                        </span>

                        <div class="actions">

                            <!-- Complete or undo a task -->
                            <form
                                action="{{ url_for('complete_task', task_id=task['id']) }}"
                                method="POST">

                                <button type="submit" class="complete-btn">
                                    {% if task['completed'] %}
                                        Undo
                                    {% else %}
                                        Complete
                                    {% endif %}
                                </button>
                            </form>

                            <!-- Delete a task -->
                            <form
                                action="{{ url_for('delete_task', task_id=task['id']) }}"
                                method="POST">

                                <button type="submit" class="delete-btn">
                                    Delete
                                </button>
                            </form>

                        </div>
                    </li>
                {% endfor %}

            </ul>

        {% else %}

            <p class="empty">No tasks yet. Add your first task!</p>

        {% endif %}

    </main>
</body>
</html>
